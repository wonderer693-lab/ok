name: Update Sales Data

on:
  schedule:
    # Runs every 12 hours at 00:00 and 12:00 UTC.
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and merge .si sales
        run: python scripts/fetch_sales.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sales.json
          if git diff --cached --quiet; then
            echo "No changes detected in src/data/sales.json — nothing to commit."
          else
            git commit -m "Auto-update domain sales data"
            git push
          fi

# The push above triggers the connected Vercel/Netlify project automatically —
# no extra deployment step is required on the free tier.
