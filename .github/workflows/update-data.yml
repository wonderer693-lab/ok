name: Update Sales Data

on:
  schedule:
    # Target cadence: every 12 hours (00:00 and 12:00 UTC).
    # GitHub frequently DELAYS scheduled jobs under load (observed: a 00:00
    # job ran 04:40; a 12:00 job ran 17:59). The extra 06:00/18:00 run keeps
    # the worst-case data freshness inside ~12h even with such delays.
    # Public repos get unlimited Actions minutes, so this stays free.
    - cron: '0 */12 * * *'
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and merge .si sales
        run: python scripts/fetch_sales.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sales.json
          if git diff --cached --quiet; then
            echo "No changes detected in src/data/sales.json — nothing to commit."
          else
            git commit -m "Auto-update domain sales data"
            git push
          fi

# The push above triggers the connected Vercel/Netlify project automatically —
# no extra deployment step is required on the free tier.
